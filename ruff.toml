# Lint settings for the Python tools in Tools/ (replay, simulation, tests).
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # long lines in report formatting are fine
    "RUF001", # we intentionally print the ± and – characters
    "RUF003",
]
