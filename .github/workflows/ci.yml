name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run, so
# superseded builds don't use up macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Python tools (lint, engine mirror tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Lint
        run: ruff check Tools
      - name: Format check
        run: ruff format --check Tools
      - name: Engine and step-gate mirror tests
        run: |
          python Tools/test_engine.py
          python Tools/test_stepgate.py
          python Tools/test_treadmill.py

  core:
    name: Core package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: Packages/JogLockCore
        run: swift test

  ios-build:
    name: iOS app build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Xcode version
        run: xcodebuild -version
      - name: Build
        run: >
          xcodebuild build
          -project JogLockTracker.xcodeproj
          -scheme JogLockTracker
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData
          -quiet
          CODE_SIGNING_ALLOWED=NO
